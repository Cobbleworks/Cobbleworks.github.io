<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#090a0b">
    <title>Page not found | Cobbleworks</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px; }
      .not-found img { margin: 0 auto 24px; }
      .not-found h1 { margin-bottom: 18px; font-size: clamp(3rem, 10vw, 6rem); }
      .not-found p { max-width: 520px; margin: 0 auto 28px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <img src="/assets/brand-mark.svg" width="64" height="64" alt="Cobbleworks">
        <p class="eyebrow"><span></span> Error 404</p>
        <h1>Lost in the<br><em>wrong chunk.</em></h1>
        <p>The page you requested does not exist. Return to the Cobbleworks collection to find an active plugin or its documentation.</p>
        <a class="button button-primary" href="/">Return home</a>
      </div>
    </main>
  </body>
</html>
