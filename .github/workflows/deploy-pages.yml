name: Deploy Cobbleworks website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate required site files
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/plugins.json >/dev/null
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f robots.txt
          test -f sitemap.xml
          test -f assets/cobbleworks-hero-september-2026.png
          grep -q 'https://cobbleworks.github.io/' index.html

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_site.py
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
